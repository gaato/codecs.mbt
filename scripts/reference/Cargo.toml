# Reference codecs written apart from this repository's, for the
# crosschecks: miniz_oxide (a Rust port of miniz) for raw DEFLATE and zlib,
# run by deflate/scripts/crosscheck.mbtx; snap (BurntSushi's Snappy) for
# Snappy's raw and framing formats, run by snappy/scripts/crosscheck.mbtx;
# lz4-sys (lz4 1.10.0's C library, vendored) for the LZ4 vectors that
# lz4/scripts/gen_vectors.mbtx writes, and lz4_flex (a Rust LZ4 that shares
# no code with lz4's) for lz4/scripts/crosscheck.mbtx; weezl (image-rs's LZW,
# the one the gif, tiff and image crates use) for lzw/scripts/.
# Not part of any MoonBit module. The versions are pinned here and in
# Cargo.lock.

[package]
name = "codecs-reference"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
miniz_oxide = "=0.9.1"
base64 = "=0.23.1"
sha2 = "=0.10.9"
snap = "=1.1.2"
lz4-sys = "=1.11.1"
lz4_flex = "=0.14.0"
weezl = "=0.1.12"
