name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parts:
    name: part (${{ matrix.part }})
    runs-on: ubuntu-26.04
    # CI timings on 2026-11-17, before the HQ test reduction:
    # f56efe80 (run 44159293290) for checks/tests/coverage, and 88a9a529
    # (run 44086050510) for crosschecks/proofs/fmt. Budgets include the
    # measured ~30 s setup and margin for cold builds and slower runners.
    # Independent jobs make wall time follow the longest part.
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: checks
            timeout: 5 # measured 58 s
          - part: test-native
            timeout: 12 # measured 8 m 9 s, check + test
          - part: test-js
            timeout: 12 # measured 7 m 11 s, check + test
          - part: test-wasm
            timeout: 15 # measured 9 m 39 s, check + test
          - part: test-wasm-gc
            timeout: 8 # measured 3 m 4 s, check + test
          - part: coverage
            timeout: 20 # measured 14 m 7 s
          - part: crosscheck
            timeout: 10 # measured 2 m 9 s; margin also covers HQ qualities
          - part: prove
            timeout: 12 # measured 5 m 13 s with Z3
          - part: fmt
            timeout: 5 # measured 4 s, fmt + interfaces
    timeout-minutes: ${{ matrix.timeout }}
    container:
      # The toolchain moonbit-version pins; moved by hand with the proofs and
      # benchmarks (renovate.json).
      image: ghcr.io/gaato/moonbit:0.10.21-06da1ed44
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trust the workspace (container runs as a different user)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Node (js target tests)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Toolchain versions
        run: moon version --all

      - name: Registry index
        # The scripts are .mbtx files; moon resolves their imports from it.
        run: moon update

      - name: Install reference tools and proof solver
        run: moon run scripts/setup_ci.mbtx

      - name: Docs audit
        # Also in checks; fail each part early on documentation errors.
        run: moon run scripts/docs_audit.mbtx --self-test

      - name: Run part
        env:
          GATES_PART: ${{ matrix.part }}
        run: moon run scripts/gates.mbtx -- --only "$GATES_PART"

  gates:
    # Main's ruleset requires this exact check name. An always-running
    # aggregate checks individual jobs: a leg cancelled before getting a
    # runner can leave needs.parts.result reporting success.
    name: gates
    if: ${{ always() }}
    needs: [parts]
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    permissions:
      actions: read
    steps:
      - name: Require every part to succeed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          gh api --paginate --slurp \
            "repos/$GH_REPO/actions/runs/$GH_RUN_ID/attempts/$GH_RUN_ATTEMPT/jobs?per_page=100" |
            jq -e '
              [.[].jobs[] | select(.name | startswith("part ("))] as $parts |
              ($parts | map(.name) | sort) == ([
                "part (checks)", "part (test-native)", "part (test-js)",
                "part (test-wasm)", "part (test-wasm-gc)", "part (coverage)",
                "part (crosscheck)", "part (prove)", "part (fmt)"
              ] | sort) and
              all($parts[]; .conclusion == "success")
            '
