name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    container:
      # Pinned toolchain, the same image as gaato/mbt-sdk and gaato/req.
      image: ghcr.io/gaato/moonbit:0.10.15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trust the workspace (container runs as a different user)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Node (js target tests)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Toolchain versions
        run: moon version --all

      - name: Install the scripts' tools
        run: apt-get update && apt-get install -y --no-install-recommends python3 python3-brotli jq gawk

      - name: Gates
        run: scripts/gates.sh

      - name: Coverage ledgers
        run: |
          source scripts/modules.sh
          for m in "${LEDGERED[@]}"; do scripts/coverage_report.sh "$m"; done
        shell: bash

      - name: Cross-check the brotli encoder with the reference decoder
        run: |
          brotli/scripts/crosscheck.py

