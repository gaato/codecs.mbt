name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    container:
      # The toolchain moonbit-version pins; moved by hand with the proofs and
      # benchmarks (renovate.json).
      image: ghcr.io/gaato/moonbit:0.10.16
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trust the workspace (container runs as a different user)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Node (js target tests)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Toolchain versions
        run: moon version --all

      - name: Install the scripts' tools
        # The reference zstd, brotli and gzip, which the generators' checks and
        # the cross-checks decode with (Node's zlib, the other reference of the
        # DEFLATE formats and the other brotli decoder the cross-checks use,
        # comes with Node), and pypng, the reference of the PNG vectors (the
        # release scripts/gen_png_vectors.mbtx names: Debian 13's python3-png),
        # and cargo, which builds the APNG vectors' reference, the png crate.
        run: apt-get update && apt-get install -y --no-install-recommends zstd brotli gzip unzip python3 python3-png cargo

      - name: Install Z3 4.16.0, the solver of moon prove
        # A script, shared with canary.yml: the official release, pinned by
        # checksum.
        run: scripts/install-z3.sh

      - name: Registry index
        # The scripts are .mbtx files; moon resolves their imports from it.
        run: moon update

      - name: Docs audit
        # Also run by the gates; here first, so that a documentation failure
        # shows before the long build and test steps.
        run: moon run scripts/docs_audit.mbtx --self-test

      - name: Gates
        run: moon run scripts/gates.mbtx

      - name: Coverage ledgers
        # Every ledgered module of scripts/modules.json.
        run: moon run scripts/coverage_report.mbtx

      - name: Cross-check the brotli encoder with the reference decoder
        run: moon run brotli/scripts/crosscheck.mbtx

      - name: Cross-check the DEFLATE, zlib and gzip encoders with the reference decoders
        run: moon run deflate/scripts/crosscheck.mbtx
