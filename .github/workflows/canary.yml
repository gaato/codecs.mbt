name: Canary

# Setup is shared with CI so missing reference tools cannot mask toolchain
# failures in the canary.

on:
  schedule:
    # 06:57 JST, after gaato/moonbit-docker rebuilds the latest and nightly images.
    - cron: "57 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    uses: gaato/.github/.github/workflows/moonbit-canary.yml@main
    with:
      gates: moon run scripts/gates.mbtx
      # MoonBit after 0.10.20 adds methods to core/async's IO traits that
      # 0.10.20 refuses, so the bench's impls of them cannot sit in the tree
      # yet. compat/core_async_next keeps them at the paths they take in the
      # tree, with `.next` appended; this copies them in on a toolchain that
      # has the methods (as gaato/mttp's canary does).
      setup: |
        moon run scripts/setup_ci.mbtx
        traits="${MOON_HOME:-$HOME/.moon}/lib/core/async/io/pkg.generated.mbti"
        if grep -q 'fn name(Self) -> String' "$traits"; then
          cd compat/core_async_next
          find . -name '*.mbt.next' | while read -r next; do
            cp "$next" "../../${next%.next}"
            echo "adopted ${next%.next}"
          done
        fi
